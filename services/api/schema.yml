components:
  schemas:
    Attendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        studentId:
          type: string
          format: uuid
          readOnly: true
        studentName:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatus'
      required:
      - date
      - id
      - status
      - studentId
      - studentName
    AttendanceStatus:
      enum:
      - PRESENT
      - ABSENT
      - LATE
      - EXCUSED
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
        * `LATE` - Late
        * `EXCUSED` - Excused
    AttendanceWrite:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatus'
      required:
      - status
      - studentId
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 32
        isHeadOffice:
          type: boolean
        isActive:
          type: boolean
        timezone:
          type: string
          maxLength: 64
      required:
      - code
      - id
      - isActive
      - isHeadOffice
      - name
    BranchCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 2
        timezone:
          type: string
          default: Asia/Kolkata
          maxLength: 64
      required:
      - name
    BranchListData:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
      required:
      - count
      - items
      - next
      - previous
    BranchListSuccess:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/BranchListData'
      required:
      - data
      - success
    BranchSuccess:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Branch'
      required:
      - data
      - success
    BranchSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 32
      required:
      - code
      - id
      - name
    ClientEnum:
      enum:
      - admin-web
      - parent-mobile
      - staff-mobile
      type: string
      description: |-
        * `admin-web` - admin-web
        * `parent-mobile` - parent-mobile
        * `staff-mobile` - staff-mobile
    DashboardSuccess:
      type: object
      properties:
        success:
          type: boolean
        data: {}
      required:
      - data
      - success
    Enquiry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        guardianName:
          type: string
        contactEmail:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        status:
          $ref: '#/components/schemas/EnquiryStatus'
        branchId:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - branchId
      - createdAt
      - guardianName
      - id
    EnquiryStatus:
      enum:
      - ENQUIRY
      - VISIT_SCHEDULED
      - APPLIED
      - ENROLLED
      - LOST
      type: string
      description: |-
        * `ENQUIRY` - Enquiry
        * `VISIT_SCHEDULED` - Visit scheduled
        * `APPLIED` - Applied
        * `ENROLLED` - Enrolled
        * `LOST` - Lost
    EnquiryWrite:
      type: object
      properties:
        guardianName:
          type: string
          maxLength: 200
        contactEmail:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        branchId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/EnquiryStatus'
      required:
      - guardianName
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 250
        eventType:
          type: string
        branchId:
          type: string
          format: uuid
          readOnly: true
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
      required:
      - branchId
      - endsOn
      - eventType
      - id
      - startsOn
      - title
    EventTypeEnum:
      enum:
      - EXAM
      - HOLIDAY
      - PTM
      - EVENT
      type: string
      description: |-
        * `EXAM` - Exam
        * `HOLIDAY` - Holiday
        * `PTM` - Parent-teacher meeting
        * `EVENT` - Event
    EventWrite:
      type: object
      properties:
        title:
          type: string
          maxLength: 250
        eventType:
          $ref: '#/components/schemas/EventTypeEnum'
        branchId:
          type: string
          format: uuid
          nullable: true
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
      required:
      - endsOn
      - eventType
      - startsOn
      - title
    ExistingParentLink:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        relationship:
          $ref: '#/components/schemas/RelationshipEnum'
      required:
      - relationship
      - studentId
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: {}
      required:
      - data
      - success
    Institute:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 32
        isActive:
          type: boolean
      required:
      - code
      - id
      - isActive
      - name
    InstituteOnboarding:
      type: object
      properties:
        instituteName:
          type: string
          maxLength: 200
          minLength: 2
        branchName:
          type: string
          maxLength: 200
          minLength: 2
        adminName:
          type: string
          maxLength: 300
          minLength: 2
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 8
      required:
      - adminName
      - branchName
      - email
      - instituteName
      - password
    InstituteOnboardingData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          additionalProperties: {}
        onboarding:
          type: object
          additionalProperties: {}
      required:
      - accessToken
      - onboarding
      - refreshToken
      - user
    InstituteOnboardingSuccess:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/InstituteOnboardingData'
      required:
      - data
      - success
    InstituteSuccess:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Institute'
      required:
      - data
      - success
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        studentId:
          type: string
          format: uuid
          readOnly: true
        studentName:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        due_date:
          type: string
          format: date
        totalPaid:
          type: string
          readOnly: true
      required:
      - amount
      - due_date
      - id
      - studentId
      - studentName
      - totalPaid
    InvoiceWrite:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
