[project]
name = "campusone-api"
version = "0.1.0"
description = "CampusOne school CRM API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "azure-storage-blob>=12.25,<13",
  "azure-identity>=1.23,<2",
  "celery[redis]>=5.5,<6",
  "django>=5.2,<5.3",
  "django-cors-headers>=4.7,<5",
  "django-environ>=0.12,<1",
  "djangorestframework>=3.16,<4",
  "djangorestframework-simplejwt>=5.5,<6",
  "drf-spectacular>=0.28,<1",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "uvicorn[standard]>=0.35,<1",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "factory-boy>=3.3,<4",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["config", "modules", "platform_core"]
