name: Build and deploy CampusOne UI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  VITE_API_BASE_URL: https://onecampus-backend-bzd6cfezgwcng9aq.centralindia-01.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build institute admin UI
        run: npm run build:admin

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9F59E89E55834DF0ABC14BEEC2E3C7F2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3CBFD44565A84ECD9B3BB6C3D5EC6618 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E615E6517A3A4DCBB872C4060ED446EA }}

      - name: Deploy UI to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: OneCampus-UI
          package: apps/institute-admin-web/dist
